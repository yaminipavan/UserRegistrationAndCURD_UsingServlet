<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Delete Book | Book Management</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #ff416c, #ff4b2b);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .delete-container {
        background: #ffffff;
        width: 400px;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .delete-container h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
    }

    .warning-text {
        text-align: center;
        color: #e53e3e;
        font-size: 14px;
        margin-bottom: 20px;
        font-weight: bold;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #555;
    }

    .form-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
    }

    .form-group input:focus {
        border-color: #ff416c;
        outline: none;
    }

    .delete-btn {
        width: 100%;
        padding: 11px;
        background: #e53e3e;
        border: none;
        color: white;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 10px;
    }

    .delete-btn:hover {
        background: #c53030;
    }

    .back-link {
        text-align: center;
        margin-top: 15px;
    }

    .back-link a {
        color: #ff416c;
        text-decoration: none;
        font-weight: bold;
    }

    .back-link a:hover {
        text-decoration: underline;
    }
</style>

</head>

<body>

<div class="delete-container">
    <h2>Delete Book</h2>

    <div class="warning-text">
        ⚠ Please enter the correct Book Code. This action cannot be undone.
    </div>

    <form action="delete" method="post">

        <div class="form-group">
            <label for="bcode">Book Code</label>
            <input type="text" name="bcode" id="bcode" required>
        </div>

        <input type="submit" value="Delete Book" class="delete-btn">

        <div class="back-link">
            <a href="index.html">⬅ Back to DashBoard</a>
        </div>

    </form>
</div>

</body>
</html>
