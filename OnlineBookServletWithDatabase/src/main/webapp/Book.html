<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Add Book | Book Management</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #1d976c, #93f9b9);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .book-container {
        background: #ffffff;
        width: 420px;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .book-container h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
    }

    .form-group {
        margin-bottom: 14px;
    }

    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #555;
    }

    .form-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
    }

    .form-group input:focus {
        border-color: #1d976c;
        outline: none;
    }

    .submit-btn {
        width: 100%;
        padding: 11px;
        background: #1d976c;
        border: none;
        color: white;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 10px;
    }

    .submit-btn:hover {
        background: #168f63;
    }

    .back-link {
        text-align: center;
        margin-top: 15px;
    }

    .back-link a {
        color: #1d976c;
        text-decoration: none;
        font-weight: bold;
    }

    .back-link a:hover {
        text-decoration: underline;
    }
</style>

</head>

<body>

<div class="book-container">
    <h2>Add Book Details</h2>

    <form action="book" method="post">

        <div class="form-group">
            <label for="bcode">Book Code</label>
            <input type="text" name="bcode" id="bcode" required>
        </div>

        <div class="form-group">
            <label for="bname">Book Name</label>
            <input type="text" name="bname" id="bname" required>
        </div>

        <div class="form-group">
            <label for="bprice">Book Price</label>
            <input type="text" name="bprice" id="bprice" required>
        </div>

        <div class="form-group">
            <label for="bqty">Book Quantity</label>
            <input type="text" name="bqty" id="bqty" required>
        </div>

        <input type="submit" value="Add Book" class="submit-btn">

        <div class="back-link">
            <a href="index.html">⬅ Back to DashBoard</a>
        </div>

    </form>
</div>

</body>
</html>
