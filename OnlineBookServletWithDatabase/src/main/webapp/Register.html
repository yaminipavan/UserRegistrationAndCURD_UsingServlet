<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>User Registration | My Application</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #43cea2, #185a9d);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .register-container {
        background: #ffffff;
        width: 420px;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .register-container h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
    }

    .form-group {
        margin-bottom: 14px;
    }

    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #555;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
    }

    .form-group input:focus,
    .form-group textarea:focus {
        border-color: #43cea2;
        outline: none;
    }

    .register-btn {
        width: 100%;
        padding: 11px;
        background: #43cea2;
        border: none;
        color: white;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 10px;
    }

    .register-btn:hover {
        background: #36b391;
    }

    .login-link {
        text-align: center;
        margin-top: 15px;
    }

    .login-link a {
        color: #185a9d;
        text-decoration: none;
        font-weight: bold;
    }

    .login-link a:hover {
        text-decoration: underline;
    }
</style>

</head>

<body>

<div class="register-container">
    <h2>User Registration</h2>

    <form action="reg" method="post">

        <div class="form-group">
            <label for="uname">Username</label>
            <input type="text" name="uname" id="uname" required>
        </div>

        <div class="form-group">
            <label for="pword">Password</label>
            <input type="password" name="pword" id="pword" required>
        </div>

        <div class="form-group">
            <label for="fname">First Name</label>
            <input type="text" name="fname" id="fname" required>
        </div>

        <div class="form-group">
            <label for="lname">Last Name</label>
            <input type="text" name="lname" id="lname" required>
        </div>

        <div class="form-group">
            <label for="addr">Address</label>
            <input type="text" name="addr" id="addr">
        </div>

        <div class="form-group">
            <label for="mid">Email ID</label>
            <input type="email" name="mid" id="mid" required>
        </div>

        <div class="form-group">
            <label for="phno">Phone Number</label>
            <input type="text" name="phno" id="phno" required>
        </div>

        <input type="submit" value="Register" class="register-btn">

        <div class="login-link">
            Already registered? <a href="login.html">Login here</a>
        </div>

    </form>
</div>

</body>
</html>
