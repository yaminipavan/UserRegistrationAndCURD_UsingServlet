<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Dashboard | Book Management</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #232526, #414345);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .dashboard-container {
        background: #ffffff;
        width: 420px;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        text-align: center;
    }

    .dashboard-container h2 {
        margin-bottom: 25px;
        color: #333;
    }

    .menu-link {
        display: block;
        text-decoration: none;
        background: #667eea;
        color: white;
        padding: 12px;
        margin: 10px 0;
        border-radius: 6px;
        font-size: 15px;
        font-weight: bold;
        transition: background 0.3s;
    }

    .menu-link:hover {
        background: #5a67d8;
    }

    .logout {
        background: #e53e3e;
    }

    .logout:hover {
        background: #c53030;
    }
</style>

</head>

<body>

<div class="dashboard-container">
    <h2>Book Management DashBoard</h2>

    <a href="Book.html" class="menu-link">Add Book Details</a>
    <a href="view1" class="menu-link">View Book Data</a>
    <a href="update.html" class="menu-link">Update Book</a>
    <a href="delete.html" class="menu-link">Delete Book By ID</a>
    <a href="logout" class="menu-link logout">Logout</a>
</div>

</body>
</html>
