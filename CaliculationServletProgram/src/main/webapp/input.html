 <!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Calculator | Server Side</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #2193b0, #6dd5ed);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .calc-container {
        background: #ffffff;
        width: 380px;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .calc-container h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #555;
    }

    .form-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
    }

    .form-group input:focus {
        border-color: #2193b0;
        outline: none;
    }

    .btn-group {
        text-align: center;
        margin-top: 15px;
    }

    .btn-group input {
        width: 70px;
        padding: 10px;
        margin: 5px;
        border: none;
        border-radius: 5px;
        background: #2193b0;
        color: white;
        font-size: 14px;
        cursor: pointer;
    }

    .btn-group input:hover {
        background: #1b7a94;
    }
</style>

</head>

<body>

<div class="calc-container">
    <h2>Server Side Calculator</h2>

    <form action="choice" method="post">

        <div class="form-group">
            <label for="v1">Enter Value 1</label>
            <input type="text" name="v1" id="v1" required>
        </div>

        <div class="form-group">
            <label for="v2">Enter Value 2</label>
            <input type="text" name="v2" id="v2" required>
        </div>

        <div class="btn-group">
            <input type="submit" value="Add" name="s1">
            <input type="submit" value="Sub" name="s1">
            <input type="submit" value="Mul" name="s1">
            <input type="submit" value="Div" name="s1">
            <input type="submit" value="Mod" name="s1">
        </div>

    </form>
</div>

</body>
</html>
